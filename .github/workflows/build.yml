name: Build Roblox Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Roblox-Lite-Projeto.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Extrair o projeto ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'Roblox-Lite-Projeto.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Roblox-Lite-Projeto.zip não encontrado. Envie o ZIP para a raiz do repositório."
            exit 1
          fi
          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project
          PROJECT_DIR="$(find extracted-project -name settings.gradle.kts -printf '%h\\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: não encontrei settings.gradle.kts dentro do ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/Roblox-Lite-1.0.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Lite-APK
          path: output/Roblox-Lite-1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK em GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/Roblox-Lite-1.0.apk
          generate_release_notes: true
